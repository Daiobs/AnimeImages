<label class="ytdlp-format-option{% if format.selected %} is-selected{% endif %}" data-picker-option>
    <input type="radio" value="{{ format.candidate_id }}"
           data-picker-radio data-token="{{ format.resource_token }}"
           data-format-id="{{ format.format_id }}"
           data-kind="{{ format.media_type }}" data-can-download="{{ format.can_download|yesno:'true,false' }}"
           data-can-preview="{{ format.can_preview|yesno:'true,false' }}"
           data-size-label="{{ format.size_label }}" data-label="{{ format.label }}"
           data-limitation="{{ format.limitation }}" {% if format.selected %}checked{% endif %}>
    <span class="ytdlp-format-copy"><strong>{{ format.label }}</strong><small>{{ format.detail_label }}</small>
        {% if format.format_id %}<small>格式 {{ format.format_id }}</small>{% endif %}
        {% if not format.can_download %}<small class="ytdlp-format-restricted">{{ format.limitation }}</small>{% endif %}
    </span>
    <span class="ytdlp-format-size">{{ format.size_label }}</span>
</label>
