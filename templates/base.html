{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}星空的高清下载小站{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ static_asset_version }}">

    {% block extra_css %}{% endblock %}
</head>

<body class="{{ theme_class|default:'theme-home' }}">
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top site-navbar">
    <div class="container-fluid px-4 px-md-5">
        <div class="d-flex align-items-center gap-4">
            <a class="navbar-brand site-brand fw-bold" href="{% url 'home' %}">
                星空的高清下载小站
            </a>

            <div class="site-nav d-none d-lg-flex align-items-center gap-4">
                <a class="site-nav-link {% if request.resolver_match.url_name == 'home' or request.resolver_match.url_name == 'home_results' %}active{% endif %}"
                   href="{% url 'home' %}">
                    首页
                </a>
                <a class="site-nav-link {% if request.resolver_match.url_name == 'xhs_home' or request.resolver_match.url_name == 'xhs_results' %}active{% endif %}"
                   href="{% url 'xhs_home' %}">
                    小红书
                </a>
                <a class="site-nav-link {% if request.resolver_match.url_name == 'tiktok_home' or request.resolver_match.url_name == 'tiktok_results' %}active{% endif %}"
                   href="{% url 'tiktok_home' %}">
                    抖音
                </a>
                <a class="site-nav-link {% if request.resolver_match.url_name == 'bilibili_home' or request.resolver_match.url_name == 'bilibili_results' %}active{% endif %}"
                   href="{% url 'bilibili_home' %}">
                    哔哩哔哩
                </a>
            </div>
        </div>

        <div class="ms-auto">
            {% block nav_actions %}{% endblock %}
        </div>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="border-top py-4 mt-5 text-center text-muted small">
    <div class="container">
        仅用于授权内容、个人素材管理与备份
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/app.js' %}?v={{ static_asset_version }}"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
