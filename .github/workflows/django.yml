name: Django

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production-9f7b6c4d2a1e8f0b5c3d6e7a8f9b0c1d
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DATABASE_URL: postgresql://animeimages:animeimages@localhost:5432/animeimages
      DJANGO_CACHE_URL: redis://localhost:6379/0
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_SESSION_COOKIE_SECURE: "False"
      DJANGO_CSRF_COOKIE_SECURE: "False"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
      DJANGO_SECURE_HSTS_PRELOAD: "False"
      KUKUTOOL_PROVIDER_ENABLED: "False"
      ULTRA_HD_PROVIDER_ENABLED: "False"
      THIRD_PARTY_PROVIDER_ENABLED: "False"
      THIRD_PARTY_PUBLIC_ACCESS_ENABLED: "False"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: animeimages
          POSTGRES_USER: animeimages
          POSTGRES_PASSWORD: animeimages
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U animeimages -d animeimages"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Django checks
        run: |
          python manage.py check
          DJANGO_SECURE_SSL_REDIRECT=True \
          DJANGO_SESSION_COOKIE_SECURE=True \
          DJANGO_CSRF_COOKIE_SECURE=True \
          DJANGO_SECURE_HSTS_SECONDS=31536000 \
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=True \
          DJANGO_SECURE_HSTS_PRELOAD=True \
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
          python manage.py inspect_third_party_provider --health --json

      - name: Django tests
        run: python manage.py test --noinput

      - name: Node frontend checks
        run: |
          node --check xhs_download/services/platforms/kukutool_provider.js
          node --check static/js/app.js
          node --check static/js/batch_parse.js
          node --check static/js/douyin_reliability.js
          node --check static/js/download_reliability.js
          node --check static/js/parse_preferences.js
          node --check static/js/xhs_download.js
          node --test tests_js/douyin_reliability.test.js
          node --test tests_js/download_reliability.test.js
          node --test tests_js/parse_preferences.test.js
