name: Django

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A PR branch is covered by its pull_request run; a newer push to the same PR
# cancels the outdated run. Every main run is kept.
concurrency:
  group: django-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nginx-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Validate Nginx baseline invariants
        run: |
          python ops/nginx/tools/check_nginx_drift.py
          python -m unittest discover -s ops/nginx/tests -p 'test_*.py' -v

      - name: Install isolated Nginx test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx

      - name: Run isolated Nginx acceptance
        run: python ops/nginx/tests/run_nginx_acceptance.py

  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production-9f7b6c4d2a1e8f0b5c3d6e7a8f9b0c1d
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DATABASE_URL: postgresql://animeimages:animeimages@localhost:5432/animeimages
      DJANGO_CACHE_URL: redis://localhost:6379/0
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_SESSION_COOKIE_SECURE: "False"
      DJANGO_CSRF_COOKIE_SECURE: "False"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
      DJANGO_SECURE_HSTS_PRELOAD: "False"
      KUKUTOOL_PROVIDER_ENABLED: "False"
      ULTRA_HD_PROVIDER_ENABLED: "False"
      THIRD_PARTY_PROVIDER_ENABLED: "False"
      THIRD_PARTY_PUBLIC_ACCESS_ENABLED: "False"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: animeimages
          POSTGRES_USER: animeimages
          POSTGRES_PASSWORD: animeimages
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U animeimages -d animeimages"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install optional upstream contract test runtimes
        run: |
          python -m pip install --no-deps yt-dlp==2026.6.9 gallery-dl==1.32.4
          echo "YTDLP_COMPAT_EXPECTED_VERSION=2026.6.9" >> "$GITHUB_ENV"

      - name: Install isolated pinned ParseHub contract runtime
        run: |
          python tools/parsehub_provider/bootstrap_parsehub_provider.py "$RUNNER_TEMP/parsehub-contract"
          echo "PARSEHUB_COMPAT_PYTHON=$RUNNER_TEMP/parsehub-contract/bin/python" >> "$GITHUB_ENV"

      - name: Django checks
        run: |
          python manage.py check
          DJANGO_SECURE_SSL_REDIRECT=True \
          DJANGO_SESSION_COOKIE_SECURE=True \
          DJANGO_CSRF_COOKIE_SECURE=True \
          DJANGO_SECURE_HSTS_SECONDS=31536000 \
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=True \
          DJANGO_SECURE_HSTS_PRELOAD=True \
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
          python manage.py inspect_third_party_provider --health --json

      - name: Django tests
        run: |
          python manage.py test --noinput
          python -m unittest tools.tests_upstream_worker_quality -q

      - name: Node frontend checks
        run: |
          node --check xhs_download/services/platforms/kukutool_provider.js
          node --test tests_js/kukutool_discovery.test.js
          node --check static/js/app.js
          node --check static/js/batch_parse.js
          node --check static/js/browser_photo_archive.js
          node --check static/js/douyin_reliability.js
          node --check static/js/download_reliability.js
          node --check static/js/ordinary_media_download.js
          node --check static/js/ordinary_media_download_sw.js
          node --check static/js/ordinary_media_streaming.js
          node --check static/js/ordinary_media_streaming_protocol.js
          node --check static/js/parse_preferences.js
          node --check static/js/provider_lab.js
          node --check static/js/platform_ledger.js
          node --check static/js/upstream_candidates.js
          node --check static/js/ytdlp_result_picker.js
          node --test tests_js/ytdlp_result_picker.test.js
          node --test tests_js/ytdlp_picker_batch_dom.test.js
          node --check static/js/project_settings.js
          node --check static/js/platform_coverage_modal.js
          node --check static/js/mail_settings.js
          node --check static/js/result_url_safety.js
          node --check static/js/user_feedback.js
          node --check static/js/xhs_livephoto_preview.js
          node --check static/js/xhs_livephoto_pair_download.js
          node --check static/js/xhs_download.js
          node --test tests_js/audit_frontend_fixes.test.js
          node --test tests_js/platform_coverage_modal.test.js
          node --test tests_js/batch_download_access.test.js
          node --test tests_js/browser_photo_archive.test.js
          node --test tests_js/xhs_livephoto_pair_download.test.js
          node --test tests_js/douyin_reliability.test.js
          node --test tests_js/download_reliability.test.js
          node --test tests_js/ordinary_media_download.test.js
          node --test tests_js/ordinary_media_streaming.test.js
          node --test tests_js/parse_preferences.test.js
          node --test tests_js/provider_lab.test.js
          node --test tests_js/provider_lab_history.test.js
          node --test tests_js/platform_ledger.test.js
          node --test tests_js/provider_lab_quality.test.js
          node --test tests_js/provider_lab_controller_quality.test.js
          node --test tests_js/upstream_candidates.test.js
          node --test tests_js/result_url_safety.test.js
          node --test tests_js/user_feedback.test.js
          node --test tests_js/upstream_downloads.test.js
          node --test tests_js/upstream_batch_authorization.test.js
          node --test tests_js/batch_preview_failure.test.js
          node --test tests_js/upstream_image_failure_ui.test.js
          node --test tests_js/xhs_livephoto_staff_preview.test.js

  ytdlp-python312:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: development
      DJANGO_SECRET_KEY: isolated-runtime-test-key-not-for-production
      DJANGO_DATABASE_URL: "sqlite:///:memory:"
      THIRD_PARTY_PROVIDER_ENABLED: "False"
      ULTRA_HD_PROVIDER_ENABLED: "False"
      KUKUTOOL_PROVIDER_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install target and previous optional runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps yt-dlp==2026.6.9 gallery-dl==1.32.4
          python -m venv "$RUNNER_TEMP/ytdlp-previous"
          "$RUNNER_TEMP/ytdlp-previous/bin/python" -m pip install --no-deps yt-dlp==2026.3.17
      - name: Target real isolated worker and shared candidate regression
        run: |
          YTDLP_COMPAT_EXPECTED_VERSION=2026.6.9 \
          YTDLP_COMPAT_ALTERNATE_PYTHON="$RUNNER_TEMP/ytdlp-previous/bin/python" \
          python manage.py test xhs_download.tests_ytdlp_runtime_compatibility --noinput
          python -m unittest tools.tests_upstream_worker_quality -q
      - name: Previous runtime offline shared-path compatibility
        run: |
          YTDLP_COMPAT_PYTHON="$RUNNER_TEMP/ytdlp-previous/bin/python" \
          YTDLP_COMPAT_EXPECTED_VERSION=2026.3.17 \
          YTDLP_COMPAT_ALTERNATE_PYTHON="$(command -v python)" \
          python manage.py test xhs_download.tests_ytdlp_runtime_compatibility --noinput
