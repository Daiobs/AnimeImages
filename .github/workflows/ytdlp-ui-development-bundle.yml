name: Ytdlp UI development bundle
on:
  push:
    branches: [feat/ytdlp-result-format-selector-v1]
    paths: [.github/workflows/ytdlp-ui-development-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare tracked-source and dependency-only offline test input
        run: |
          mkdir -p /tmp/dokitool-ui-validation/wheels
          git archive --format=tar.gz --output=/tmp/dokitool-ui-validation/source.tar.gz HEAD
          python -m pip download --only-binary=:all: -r requirements.txt -d /tmp/dokitool-ui-validation/wheels
          git rev-parse HEAD > /tmp/dokitool-ui-validation/SOURCE_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: ytdlp-ui-offline-validation-input
          path: /tmp/dokitool-ui-validation/
          retention-days: 1
