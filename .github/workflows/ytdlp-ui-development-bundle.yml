name: Materialize validated yt-dlp result picker
on:
  push:
    branches: [feat/ytdlp-result-format-selector-v1]
    paths: [.github/workflows/ytdlp-ui-development-bundle.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'Daiobs/AnimeImages' && github.ref == 'refs/heads/feat/ytdlp-result-format-selector-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply locally tested patch and verify complete resulting tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '73db351e4278209bf56367ca040d6cdd0f61d5d1'
          python3 - <<'PY'
          import base64, hashlib, pathlib, zlib
          data = ''.join(pathlib.Path(f'.development/ytdlp-part{i}.txt').read_text() for i in range(1, 5))
          patch = zlib.decompress(base64.b64decode(data, validate=True))
          assert len(patch) == 99457
          assert hashlib.sha256(patch).hexdigest() == 'c518de7ef462f5337f16005d8ca56b08fbceb6be0a3aa4a9a2a10e0848e6ae9f'
          pathlib.Path('/tmp/ytdlp-result-picker.patch').write_bytes(patch)
          PY
          git apply --check /tmp/ytdlp-result-picker.patch
          git apply /tmp/ytdlp-result-picker.patch
          rm .development/ytdlp-part{1,2,3,4}.txt
          rmdir .development
          rm .github/workflows/ytdlp-ui-development-bundle.yml
          git add -A
          test "$(git write-tree)" = '8b88e323bb303b46bac89b4c52314d76815d3482'
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/feat/ytdlp-result-format-selector-v1 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add yt-dlp work preview and exact selected-format browser downloads'
          git push origin HEAD:refs/heads/feat/ytdlp-result-format-selector-v1
