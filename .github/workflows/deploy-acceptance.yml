name: Deploy Acceptance

# Isolated-user deploy and managed-release acceptance. It exercises the deploy
# and release scripts, their ops files, the Django project entry and the
# requirements and pre-migration database checks. It runs when those change,
# weekly for base-image drift, and on demand before a release. Not a required check.
on:
  pull_request:
    paths:
      - "ops/deploy/**"
      - "ops/managed-release/**"
      - "scripts/*deploy*"
      - "scripts/*release*"
      - "scripts/restart.sh"
      - "scripts/health_check.sh"
      - "djangoProject/**"
      - "manage.py"
      - "xhs_download/apps.py"
      - "xhs_download/checks.py"
      - "xhs_download/models.py"
      - "xhs_download/migrations/**"
      - "xhs_download/tests_mail_channel.py"
      - "xhs_download/services/mail_channel.py"
      - "xhs_download/services/env_config.py"
      - "xhs_download/services/provider_daily_validation.py"
      - "xhs_download/services/provider_settings.py"
      - "xhs_download/services/provider_runtime_config.py"
      - "xhs_download/services/platforms/douyin_kukutool.py"
      - "requirements*.txt"
      - ".python-version"
      - ".github/workflows/deploy-acceptance.yml"
  push:
    branches:
      - main
    paths:
      - "ops/deploy/**"
      - "ops/managed-release/**"
      - "scripts/*deploy*"
      - "scripts/*release*"
      - "scripts/restart.sh"
      - "scripts/health_check.sh"
      - "djangoProject/**"
      - "manage.py"
      - "xhs_download/apps.py"
      - "xhs_download/checks.py"
      - "xhs_download/models.py"
      - "xhs_download/migrations/**"
      - "xhs_download/tests_mail_channel.py"
      - "xhs_download/services/mail_channel.py"
      - "xhs_download/services/env_config.py"
      - "xhs_download/services/provider_daily_validation.py"
      - "xhs_download/services/provider_settings.py"
      - "xhs_download/services/provider_runtime_config.py"
      - "xhs_download/services/platforms/douyin_kukutool.py"
      - "requirements*.txt"
      - ".python-version"
      - ".github/workflows/deploy-acceptance.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migration-startup-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_ENV: development
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: isolated-migration-regression-only
      DJANGO_CACHE_URL: ""
      # The regression enables mail after creating a synthetic database channel.
      PROVIDER_VALIDATION_EMAIL_DELIVERY_ENABLED: "False"
      KUKUTOOL_PROVIDER_ENABLED: "True"
      ULTRA_HD_PROVIDER_ENABLED: "True"
      # Empty sidecar URL still reads runtime configuration but sends no HTTP.
      KUKUTOOL_SIDECAR_BASE_URL: ""
      THIRD_PARTY_PROVIDER_ENABLED: "False"
      THIRD_PARTY_PUBLIC_ACCESS_ENABLED: "False"
      THIRD_PARTY_KUKUTOOL_PROVIDER_ENABLED: "False"
      YTDLP_PROVIDER_ENABLED: "False"
      GALLERYDL_PROVIDER_ENABLED: "False"
      YOUTUBE_MERGE_PROVIDER_ENABLED: "False"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mail_bootstrap
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d mail_bootstrap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Migrate the previous release schema with database-backed startup checks
        run: |
          test ! -e .env
          KUKUTOOL_NODE_BINARY="$(command -v node)"
          export KUKUTOOL_NODE_BINARY
          TEST=xhs_download.tests_mail_channel.MailMigrationTests.test_real_migrate_from_0031_with_database_mail_checks
          DJANGO_DATABASE_URL='sqlite::memory:' python -B manage.py test "$TEST" --noinput --verbosity 2
          DJANGO_DATABASE_URL='postgresql://ci:ci@127.0.0.1:5432/mail_bootstrap' python -B manage.py test "$TEST" --noinput --verbosity 2

  deploy-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Linux deployment permission acceptance (isolated users)
        run: |
          docker build -t animeimages-deploy-permission-tests -f ops/deploy/tests/Dockerfile .
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/source:ro" animeimages-deploy-permission-tests

      - name: Managed release channel acceptance (narrow sudo boundary)
        run: |
          bash -n scripts/deploy.sh scripts/managed_release.sh ops/managed-release/animeimages-consumer-probe
          python -m unittest discover -s ops/managed-release/tests -p 'test_installer.py' -v
          python -m unittest discover -s ops/managed-release/tests -p 'test_package.py' -v
          python scripts/package_managed_release.py --output "$RUNNER_TEMP/animeimages-managed-release.tar"
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/source:ro" --entrypoint python animeimages-deploy-permission-tests -B /source/ops/managed-release/tests/test_channel.py
